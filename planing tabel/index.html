<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes Emplois du Temps</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ACCUEIL -->

<div id="home">

    <h1>📅 Mes Emplois du Temps</h1>

    <div class="topbar">

        <input
        type="text"
        id="search"
        placeholder="🔍 Rechercher un planning..."
        oninput="searchPlannings()">

        <button onclick="addPlanning()">
            ➕ Ajouter
        </button>

        <button onclick="toggleTheme()">
            🌙 Mode
        </button>

    </div>

    <div id="planningList"></div>

</div>

<!-- PAGE PLANNING -->

<div id="planner">

    <div class="planner-top">

        <button onclick="goHome()">
            ⬅ Retour
        </button>

        <button onclick="exportPDF()">
            📤 PDF
        </button>

    </div>

    <h1 id="planningTitle">
        Mon planning
    </h1>

    <table>

        <thead>

        <tr>

            <th>Heure</th>

            <th>
                Lundi
                <br>
                <small id="date0"></small>
            </th>

            <th>
                Mardi
                <br>
                <small id="date1"></small>
            </th>

            <th>
                Mercredi
                <br>
                <small id="date2"></small>
            </th>

            <th>
                Jeudi
                <br>
                <small id="date3"></small>
            </th>

            <th>
                Vendredi
                <br>
                <small id="date4"></small>
            </th>

            <th>
                Samedi
                <br>
                <small id="date5"></small>
            </th>

            <th>
                Dimanche
                <br>
                <small id="date6"></small>
            </th>

        </tr>

        </thead>

        <tbody id="planningBody">

        </tbody>

    </table>
</div>
<script src="script.js"></script>
</body>
</html>
